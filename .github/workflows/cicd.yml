name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and Code Quality
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (actions/checkout)
      uses: actions/checkout@v7

    - name: Set up Python (actions/setup-python)
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install pip dependencies
      run: |
        pip install -e .[dev]
        pip install ruff

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with ruff
      run: ruff format --check .

  # Unit Tests
  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - name: Checkout (actions/checkout)
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }} (actions/setup-python)
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install pip dependencies
      run: |
        pip install -e .[dev]
        pip install ruff pytest

    - name: Run tests with pytest
      run: pytest -v

  # Docker Build for Testing
  docker-build:
    runs-on: ubuntu-latest
    needs: [unit-test]
    permissions:
      contents: read
      actions: write  # For Docker build cache
    steps:
    - name: Checkout (actions/checkout)
      uses: actions/checkout@v7

    - name: Set up Docker Buildx (docker/setup-buildx-action)
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image (docker/build-push-action)
      uses: docker/build-push-action@v7
      with:
        load: true
        tags: openai-ocr-server:build
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=${{ runner.temp }}/openai-ocr-server.tar

    - name: Cache Docker Image (actions/upload-artifact)
      uses: actions/upload-artifact@v7
      with:
        name: openai-ocr-server-${{ github.sha }}
        path: ${{ runner.temp }}/openai-ocr-server.tar

  # API Testing
  api-test:
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
    steps:
    - name: Checkout (actions/checkout)
      uses: actions/checkout@v7

    - name: Set up Python (actions/setup-python)
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up Docker Buildx (docker/setup-buildx-action)
      uses: docker/setup-buildx-action@v4

    - name: Download Cached Docker Image (actions/download-artifact)
      uses: actions/download-artifact@v8
      with:
        name: openai-ocr-server-${{ github.sha }}
        path: ${{ runner.temp }}

    - name: Docker Load Image
      run: |
        docker load --input ${{ runner.temp }}/openai-ocr-server.tar
        docker image ls -a

    - name: Install integration test dependencies
      run: |
        pip install httpx pillow

    - name: Run docker image for API tests
      run: |
        docker run -d --name ocr-server-test -p 8000:8000 openai-ocr-server:build
        sleep 5

    - name: Test docker image /health endpoint
      run: |
        curl --connect-timeout 10 -sf http://localhost:8000/health || exit 1

    - name: Run API integration tests with python
      run: |
        python -c "
        import base64, io, time
        import httpx
        from PIL import Image, ImageDraw

        img = Image.new('L', (400, 100), 255)
        draw = ImageDraw.Draw(img)
        draw.text((10, 20), 'CI Smoke Test', fill=0)
        buf = io.BytesIO()
        img.save(buf, format='PNG')
        url = 'data:image/png;base64,' + base64.b64encode(buf.getvalue()).decode()

        # Wait for the service to be ready (Indra downloads weights on first load)
        ready = False
        for _ in range(60):
            try:
                r = httpx.get('http://localhost:8000/health', timeout=5.0)
                if r.status_code == 200:
                    ready = True
                    break
            except Exception:
                pass
            time.sleep(2)
        assert ready, 'service did not become ready'

        r = httpx.post(
            'http://localhost:8000/v1/chat/completions',
            json={
                'model': 'indra-ocr',
                'messages': [
                    {'role': 'user', 'content': [{'type': 'image_url', 'image_url': {'url': url}}]}
                ],
                'temperature': 0.2,
                'top_p': 0.9,
                'max_tokens': 4096,
            },
            timeout=300.0,
        )
        print(f'status: {r.status_code}')
        assert r.status_code == 200, r.text
        body = r.json()
        assert body['choices'][0]['message']['content'].strip(), 'OCR returned empty content'
        assert body['choices'][0]['finish_reason'] == 'stop'
        print('OCR content:', body['choices'][0]['message']['content'])
        print('All API integration tests passed!')
        "

    - name: Cleanup (stop container)
      run: docker stop ocr-server-test || true

  # Deploy (only on push to main)
  deploy-ghcr-io:
    runs-on: ubuntu-latest
    needs: api-test
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      actions: write  # For Docker build cache

    steps:
    - name: Checkout (actions/checkout)
      uses: actions/checkout@v7

    - name: Set up Docker Buildx (docker/setup-buildx-action)
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry (docker/login-action)
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (docker/metadata-action)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value={{date 'YYYYMMDDhhmmss' tz='UTC'}}
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image (docker/build-push-action)
      uses: docker/build-push-action@v7
      with:
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
