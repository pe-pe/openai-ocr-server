[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-ocr-server"
version = "0.1.0"
description = "Self-hosted OCR inference service with an OpenAI-compatible chat-completions API"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "PyYAML>=6.0",
    "Pillow>=13.0",
    "indra-ocr>=1.1",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100